# Hand-authored (unlike release.yml, which is cargo-dist-generated and must not
# be hand-edited). Exercises the real Windows rename-aside swap that the
# `upgrade` fixture test performs — the-loop's own dev machines have no
# Windows box, so this is the only place that leg runs.
#
# Pinned fact (design-time, cargo-dist 0.32.0): the PowerShell installer
# performs no checksum verification at all (the-loop-installer.ps1) — only
# the shell installer does. So this job proves the Windows rename-aside swap
# works, not the sha256 checksum bar; the corrupt-archive case in
# upgrade_fixture.rs asserts an unpack failure on Windows instead of a
# checksum mismatch, for exactly that reason.
#
# This job's greenness is a release-gate ready check (see the Release
# runbook in docs/architecture.md), not a validate-time assertion — it only
# runs at workflow_dispatch or on push to main, never on feature-branch
# pushes or pull requests.
name: upgrade-windows

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  upgrade-fixture-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --package the-loop --features upgrade --test upgrade_fixture
