[package]
name = "the-loop"
version = "0.8.1"
edition = "2024"
description = "An owned, composable agentic dev loop — Rust CLI scaffold"
repository = "https://github.com/jatassi/the-loop"
readme = "../README.md"
keywords = ["cli", "agent", "claude", "dev-loop"]
categories = ["command-line-utilities", "development-tools"]
# Not published; SPDX reserved so clippy::cargo_common_metadata is satisfied
# without inventing a public license decision for the monorepo.
license = "LicenseRef-Proprietary"

# `upgrade` compiles in the self-replacing `the-loop upgrade` body (network +
# installer exec). Off by default so ordinary `cargo build`/`cargo test` produce a
# binary that refuses with the manual-install remedy; release builds turn it on
# through `features` under `[dist]` in `dist-workspace.toml`.
[features]
upgrade = []

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[lints]
workspace = true
